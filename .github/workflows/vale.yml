name: Vale

on:
  pull_request:
    paths:
      - "website/docs/**"
      - ".vale.ini"
      - "styles/**"

jobs:
  vale:
    name: Style lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Reports and blocks on errors in changed lines only. Warnings and suggestions are
      # advisory: run `vale website/docs` locally. Posting them all made large PRs fail
      # (hundreds of review comments, GitHub 502).
      - name: Vale
        uses: errata-ai/vale-action@reviewdog
        with:
          files: website/docs
          vale_flags: "--minAlertLevel=error"
          filter_mode: added
          reporter: github-pr-review
          fail_on_error: true
