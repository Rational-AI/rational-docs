# Style linting for the docs. Rules: STYLE.md. Run: vale sync && vale website/docs
StylesPath = styles
MinAlertLevel = suggestion
Packages = Google
Vocab = Rational

# ponytail: MDX linted as Markdown, avoids the mdx2vast dependency; switch if JSX noise grows
[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Vale, Google, Rational
# Skip JSX props and image requires
TokenIgnores = (\{\{[^}]*\}\}), (require\([^)]*\)), (\bimport .* from .*), (/[A-Za-z0-9_./#-]+), ("[^"\n]*—[^"\n]*"), (\*"[^"\n]+"\*)

# Allowed by STYLE.md, or too noisy to be useful
Google.We = NO
Google.Passive = NO
Google.Parens = NO
Google.EmDash = NO
Google.Semicolons = NO
Google.Contractions = NO
Google.Quotes = NO
Google.Colons = NO
Google.Acronyms = NO
# Replaced by Rational.Spelling and Rational.Headings (product-name exceptions)
Google.Spelling = NO
Google.Headings = NO

# Spelling flags product and technical terms: advisory only, so it never blocks a PR
Vale.Spelling = warning
Vale.Terms = warning
Google.Units = warning
Google.OptionalPlurals = warning
